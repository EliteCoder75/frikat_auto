[build]
  publish = "."
  command = "npm install && npm run build"
  functions = "netlify/functions"
  # Les véhicules (_vehicules/) sont lus en direct par la fonction vehicles.js
  # depuis GitHub — pas besoin de redéployer le site quand seul ce dossier
  # change (ex: ajout/edit d'un véhicule via la CMS). images/ n'est PAS exclu :
  # il contient aussi les visuels du site (logo, photo de couverture...) qui,
  # eux, sont servis par le build Netlify et doivent donc déclencher un déploiement.
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ":(exclude)_vehicules"'

[build.environment]
  NODE_VERSION = "18"

[dev]
  framework = "#static"
  publish = "."
  functions = "netlify/functions"
  port = 8888

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
